<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>certguard — sign in</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🛡️</text></svg>">
  <script src="/static/pages.js"></script>
  <script src="/static/prefs-init.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="centered">
  <form id="loginForm" class="card login-card" autocomplete="on">
    <h1 class="brand">certguard</h1>
    <p class="muted" id="loginSubtitle">Active TLS certificate monitor</p>
    <label>Email
      <!-- "webauthn" lets the browser offer saved passkeys in this field's own
           autofill list, so a returning user never has to ask the server
           whether they have one. -->
      <input type="email" name="email" id="email" required autofocus autocomplete="username webauthn">
    </label>
    <label id="passwordField">Password
      <input type="password" name="password" id="password" required>
    </label>
    <label id="codeField" hidden>Authentication code
      <input type="text" name="code" id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code">
    </label>
    <button type="submit" class="btn primary" id="loginBtn">Sign in</button>
    <button type="button" class="btn primary" id="keyBtn" hidden>🔐 Sign in with a passkey or security key</button>
    <button type="button" class="linkish" id="usePasswordLink" hidden>Use password instead</button>
    <button type="button" class="linkish" id="useKeyLink" hidden>Use a passkey or security key instead</button>
    <p id="hint" class="muted small" hidden></p>
    <p id="error" class="error" hidden></p>
  </form>
  <script src="/static/webauthn.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
