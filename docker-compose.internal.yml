# certguard — bundled Caddy with a TRUSTED internal certificate.
#
# For a LAN / internal deployment where you DON'T have a public domain (so
# Let's Encrypt can't be used) but still want a real green-padlock cert instead
# of self-signed warnings. One stack: certguard + Caddy, and Caddy mints the
# certificate from its own local CA.
#
# Use this when NOTHING else on the host already uses ports 80/443. If you
# already run a reverse proxy (Nginx Proxy Manager, Traefik, another Caddy),
# don't use this — add a route to that proxy instead (it owns 80/443).
#
# Setup:
#   1) Pick an internal hostname and make it resolve to this host on your LAN
#      (an A record in your internal DNS, or a hosts-file entry), e.g.
#        certguard.lan  ->  192.168.1.50
#   2) Create a .env file next to this file:
#        CERTGUARD_DOMAIN=certguard.lan
#   3) docker compose -f docker-compose.internal.yml up -d
#   4) Open https://certguard.lan and create your admin account.
#   5) Trust the CA on the machines that will use certguard so the padlock goes
#      green (one-time): Settings -> Security -> Download CA certificate (or visit
#      https://certguard.lan/ca.crt), install it into "Trusted Root Certification
#      Authorities", then FULLY QUIT AND REOPEN THE BROWSER (a refresh isn't
#      enough — browsers only read the cert store at startup). Full per-OS steps:
#      docs/INSTALL.md.
services:
  certguard:
    image: ghcr.io/rudeboi1992/certguard:latest
    container_name: certguard
    restart: unless-stopped
    environment:
      # TLS terminates at Caddy, so mark the session cookie Secure.
      CERTGUARD_COOKIE_SECURE: "true"
      CERTGUARD_CHECK_INTERVAL: ${CERTGUARD_CHECK_INTERVAL:-6h}
      # Caddy (which owns the CA and runs as root) serves its own root cert at
      # /ca.crt. This makes the "Download CA certificate" button appear in
      # Settings, pointing there — certguard itself never needs to read Caddy's
      # protected key material.
      CERTGUARD_CA_URL: /ca.crt
    volumes:
      - certguard_data:/data
    # No published ports: only Caddy reaches certguard, on the internal network.

  caddy:
    image: caddy:2-alpine
    container_name: certguard-caddy
    restart: unless-stopped
    environment:
      CERTGUARD_DOMAIN: ${CERTGUARD_DOMAIN:?set CERTGUARD_DOMAIN in your .env, e.g. certguard.lan}
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data      # holds the local CA — back this up, don't delete it
      - caddy_config:/config
    depends_on:
      - certguard

# Inline Caddyfile: HTTPS via Caddy's internal CA, serve the root at /ca.crt, and
# proxy everything else to certguard. ($$ escapes compose interpolation so Caddy
# sees the {$CERTGUARD_DOMAIN} env placeholder.)
configs:
  caddyfile:
    content: |
      {$$CERTGUARD_DOMAIN} {
          tls internal
          handle_path /ca.crt {
              root * /data/caddy/pki/authorities/local
              rewrite * /root.crt
              file_server
          }
          handle {
              reverse_proxy certguard:8181
          }
      }

volumes:
  certguard_data:
  caddy_data:
  caddy_config:
