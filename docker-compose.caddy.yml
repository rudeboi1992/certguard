# certguard behind Caddy with automatic HTTPS — the recommended secure setup for
# a real domain with multiple admins.
#
# Setup:
#   1) Point your domain's DNS (A/AAAA record) at this host.
#   2) Create a .env file next to this file:
#        CERTGUARD_DOMAIN=certguard.example.com
#   3) docker compose -f docker-compose.caddy.yml up -d
#   4) Open https://certguard.example.com and create your admin account
#      (then add more admins from Settings → Users).
#
# Caddy provisions and renews a trusted TLS certificate automatically (ports 80
# and 443 must be reachable). certguard itself is NOT exposed to the network —
# it's reachable only through Caddy on the private Docker network. Data and the
# secret-vault key persist in the certguard_data volume.
services:
  certguard:
    image: ghcr.io/rudeboi1992/certguard:latest
    # To build from source instead of pulling: comment the image line and use `build: .`
    environment:
      CERTGUARD_DB_DSN: /data/certguard.db
      CERTGUARD_KEY_FILE: /data/certguard.key
      # The browser reaches us via Caddy over HTTPS, so mark the session cookie Secure.
      CERTGUARD_COOKIE_SECURE: "true"
      CERTGUARD_CHECK_INTERVAL: ${CERTGUARD_CHECK_INTERVAL:-6h}
      CERTGUARD_MAIL_HOST: ${CERTGUARD_MAIL_HOST:-}
      CERTGUARD_MAIL_PORT: ${CERTGUARD_MAIL_PORT:-587}
      CERTGUARD_MAIL_USER: ${CERTGUARD_MAIL_USER:-}
      CERTGUARD_MAIL_PASS: ${CERTGUARD_MAIL_PASS:-}
      CERTGUARD_MAIL_FROM: ${CERTGUARD_MAIL_FROM:-}
    volumes:
      - certguard_data:/data
    restart: unless-stopped
    # No published ports: only Caddy talks to certguard, on the internal network.

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      CERTGUARD_DOMAIN: ${CERTGUARD_DOMAIN:?set CERTGUARD_DOMAIN in your .env, e.g. certguard.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - certguard
    restart: unless-stopped

volumes:
  certguard_data:
  caddy_data:
  caddy_config:
