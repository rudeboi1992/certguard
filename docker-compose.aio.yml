# certguard — all-in-one. ONE container, automatic HTTPS for your domain, no
# reverse proxy to run. certguard fetches and renews its own Let's Encrypt
# certificate.
#
# Setup:
#   1) Point your domain's DNS (A/AAAA record) at this host.
#   2) Create a .env file next to this file:
#        CERTGUARD_ACME_DOMAIN=certguard.example.com
#        # CERTGUARD_ACME_EMAIL=you@example.com   # optional
#   3) docker compose -f docker-compose.aio.yml up -d
#   4) Open https://certguard.example.com and create your admin account
#      (add more admins from Settings → Users).
#
# Ports 80 and 443 must be reachable from the internet for the certificate to
# issue and renew. Data, the vault key, and the certs all persist in the
# certguard_data volume.
services:
  certguard:
    image: ghcr.io/rudeboi1992/certguard:latest
    # To build from source instead of pulling: comment the image line and use `build: .`
    ports:
      - "80:80"
      - "443:443"
    # Let the non-root container bind the privileged ports 80/443.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    environment:
      CERTGUARD_ACME_DOMAIN: ${CERTGUARD_ACME_DOMAIN:?set CERTGUARD_ACME_DOMAIN in your .env, e.g. certguard.example.com}
      CERTGUARD_ACME_EMAIL: ${CERTGUARD_ACME_EMAIL:-}
      CERTGUARD_CHECK_INTERVAL: ${CERTGUARD_CHECK_INTERVAL:-6h}
      CERTGUARD_MAIL_HOST: ${CERTGUARD_MAIL_HOST:-}
      CERTGUARD_MAIL_PORT: ${CERTGUARD_MAIL_PORT:-587}
      CERTGUARD_MAIL_USER: ${CERTGUARD_MAIL_USER:-}
      CERTGUARD_MAIL_PASS: ${CERTGUARD_MAIL_PASS:-}
      CERTGUARD_MAIL_FROM: ${CERTGUARD_MAIL_FROM:-}
    volumes:
      - certguard_data:/data
    restart: unless-stopped

volumes:
  certguard_data:
