# certguard — Portainer App Template stack.
#
# This is the compose the certguard App Template deploys. The template form
# (Settings → App Templates → certguard) fills the ${...} values below, so you
# normally never edit this file by hand — you just click Deploy and fill the form.
#
# It serves plain HTTP on the chosen port (default 8181), which is the most
# compatible default: run it on localhost/VPN, or put it behind whatever reverse
# proxy you already use (Nginx Proxy Manager, Traefik, Caddy) for HTTPS. For a
# self-contained HTTPS setup with your own domain, use docker-compose.aio.yml
# from the repo instead.
services:
  certguard:
    image: ghcr.io/rudeboi1992/certguard:latest
    container_name: certguard
    restart: unless-stopped
    ports:
      - "${CERTGUARD_PORT:-8181}:8181"
    environment:
      # Optional: auto-create the first admin so no setup screen is needed. Leave
      # blank to create it in the browser on first visit. Used once, on an empty
      # database; ignored afterward.
      CERTGUARD_ADMIN_EMAIL: ${CERTGUARD_ADMIN_EMAIL:-}
      CERTGUARD_ADMIN_PASSWORD: ${CERTGUARD_ADMIN_PASSWORD:-}
      # Set true when a reverse proxy terminates HTTPS in front of certguard, so
      # the session cookie is marked Secure.
      CERTGUARD_COOKIE_SECURE: ${CERTGUARD_COOKIE_SECURE:-false}
      CERTGUARD_CHECK_INTERVAL: ${CERTGUARD_CHECK_INTERVAL:-6h}
      # Optional SMTP for email alerts.
      CERTGUARD_MAIL_HOST: ${CERTGUARD_MAIL_HOST:-}
      CERTGUARD_MAIL_PORT: ${CERTGUARD_MAIL_PORT:-587}
      CERTGUARD_MAIL_USER: ${CERTGUARD_MAIL_USER:-}
      CERTGUARD_MAIL_PASS: ${CERTGUARD_MAIL_PASS:-}
      CERTGUARD_MAIL_FROM: ${CERTGUARD_MAIL_FROM:-}
    volumes:
      - certguard_data:/data

volumes:
  certguard_data:
